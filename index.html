<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALLDAYNYC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #f8f7f4;
      --red: #c0221e;
      --mid: rgba(255,255,255,0.55);
    }

    html, body { height: 100%; }

    body {
      color: var(--white);
      font-family: 'Arial Black', 'Arial Bold', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 52px 24px;
      position: relative;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: url('IMG_4956.jpeg') center center / cover no-repeat;
      z-index: 0;
    }

    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 150px;
      height: 150px;
      object-fit: contain;
      margin-bottom: 24px;
      animation: fadeUp 0.6s ease both;
      border-radius: 50%;
      outline: 3px solid rgba(255,255,255,0.9);
      outline-offset: 4px;
      filter: drop-shadow(0 0 10px rgba(255,255,255,0.35));
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 15px 22px;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-decoration: none;
      color: var(--white);
      font-family: 'Arial Black', 'Arial Bold', sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: all 0.22s ease;
      animation: fadeUp 0.55s ease both;
      position: relative;
      overflow: hidden;
    }

    .link-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--red);
      transition: width 0.22s ease;
      z-index: 0;
    }

    .link-item:hover::before { width: 100%; }
    .link-item:hover { border-color: var(--red); color: var(--white); }
    .link-item:hover .arrow { opacity: 1; transform: translate(2px, -2px); }

    .link-left {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .icon {
      width: 18px;
      height: 18px;
      opacity: 0.75;
      flex-shrink: 0;
    }

    .label { position: relative; z-index: 1; }

    .arrow {
      opacity: 0.35;
      font-size: 14px;
      transition: opacity 0.2s, transform 0.2s;
      position: relative;
      z-index: 1;
    }

    .link-item:nth-child(1) { animation-delay: 0.15s; }
    .link-item:nth-child(2) { animation-delay: 0.21s; }
    .link-item:nth-child(3) { animation-delay: 0.27s; }
    .link-item:nth-child(4) { animation-delay: 0.33s; }
    .link-item:nth-child(5) { animation-delay: 0.39s; }

    .contact-row {
      margin-top: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeUp 0.55s 0.45s ease both;
    }

    .contact-label {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mid);
    }

    .contact-link {
      font-size: 12px;
      font-weight: 700;
      color: var(--mid);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }

    .contact-link:hover { color: var(--red); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="bg"></div>

  <div class="container">

    <img class="logo" src="Final.png" alt="ALLDAYNYC Logo" />

    <div class="links">

        <span class="link-left">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">

    </div>

    <div class="contact-row">
      <span class="contact-label">Contact &mdash;</span>
      <a class="contact-link" href="mailto:Dan@allday.nyc">Dan@allday.nyc</a>
    </div>

  </div>
</body>
</html>
