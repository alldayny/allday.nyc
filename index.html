  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white: #f8f7f4;
      --red: #c0221e;
      --mid: rgba(255,255,255,0.55);
    }

    html, body { height: 100%; }

    body {
      color: var(--white);
      font-family: 'Arial Black', 'Arial Bold', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 52px 24px;
      position: relative;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      background: url('L1057424.jpg') center center / cover no-repeat;
      z-index: 0;
    }

    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    .live-banner {
      display: none;
      width: 100%;
      margin-bottom: 16px;
      animation: fadeUp 0.5s ease both;
    }

    .live-banner a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 14px 20px;
      background: #6441a5;
      text-decoration: none;
      color: var(--white);
      border: 1.5px solid #7d5bbe;
    }

    .live-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4040;
      animation: pulse 1.4s ease infinite;
      flex-shrink: 0;
    }

    .live-text {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .live-game {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.06em;
      opacity: 0.75;
      margin-top: 2px;
      font-family: Arial, sans-serif;
    }

    .live-watch {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0.85;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .logo {
      width: 160px;
      height: 160px;
      object-fit: cover;
      object-position: center center;
      border-radius: 50%;
      border: none;
      margin-bottom: 24px;
      animation: fadeUp 0.6s ease both;
      filter: brightness(1.4) contrast(1.1) drop-shadow(0 0 12px rgba(255,255,255,0.4));
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 15px 22px;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      text-decoration: none;
      color: var(--white);
      font-family: 'Arial Black', 'Arial Bold', sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: all 0.22s ease;
      animation: fadeUp 0.55s ease both;
      position: relative;
      overflow: hidden;
    }

    .link-item::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--red);
      transition: width 0.22s ease;
      z-index: 0;
    }

    .link-item:hover::before { width: 100%; }
    .link-item:hover { border-color: var(--red); color: var(--white); }
    .link-item:hover .arrow { opacity: 1; transform: translate(2px, -2px); }

    .link-left {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .icon {
      width: 18px;
      height: 18px;
      opacity: 0.75;
      flex-shrink: 0;
    }

    .label { position: relative; z-index: 1; }

    .arrow {
      opacity: 0.35;
      font-size: 14px;
      transition: opacity 0.2s, transform 0.2s;
      position: relative;
      z-index: 1;
    }

    .link-item:nth-child(1) { animation-delay: 0.15s; }
    .link-item:nth-child(2) { animation-delay: 0.21s; }
    .link-item:nth-child(3) { animation-delay: 0.27s; }
    .link-item:nth-child(4) { animation-delay: 0.33s; }
    .link-item:nth-child(5) { animation-delay: 0.39s; }

    .contact-row {
      margin-top: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      animation: fadeUp 0.55s 0.45s ease both;
    }

    .contact-label {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mid);
    }

    .contact-link {
      font-size: 12px;
      font-weight: 700;
      color: var(--mid);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }

    .contact-link:hover { color: var(--red); }

    .gallery-section { display: none; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 24px;
      animation: fadeUp 0.3s ease both;
    }

    .modal-content {
      width: 100%;
      max-width: 460px;
      position: relative;
    }

    .modal-close {
      position: absolute;
      top: -40px;
      right: 0;
      background: none;
      border: none;
      color: var(--white);
      font-size: 20px;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .modal-close:hover { opacity: 1; }

    .gallery-title {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 12px;
    }

    .gallery-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .gallery-scroll::-webkit-scrollbar { display: none; }

    .gallery-item {
      flex-shrink: 0;
      width: 200px;
    }

    .gallery-item img {
      width: 200px;
      height: 300px;
      object-fit: cover;
      display: block;
    }

    .download-btn {
      display: block;
      width: 100%;
      padding: 8px 0;
      background: rgba(0,0,0,0.6);
      color: var(--white);
      text-align: center;
      text-decoration: none;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.2);
      transition: background 0.2s, border-color 0.2s;
    }

    .download-btn:hover {
      background: var(--red);
      border-color: var(--red);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script>
    async function checkTwitchLive() {
      try {
        const res = await fetch('/.netlify/functions/twitch-live');
        const data = await res.json();
        if (data.live) {
          document.getElementById('liveBanner').style.display = 'block';
          document.getElementById('liveGame').textContent = data.title || '';
        } else {
          document.getElementById('liveBanner').style.display = 'none';
        }
      } catch (e) {
        console.log('Live check failed:', e);
      }
    }

    checkTwitchLive();
    setInterval(checkTwitchLive, 180000);
  </script>
